<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مونوپولی | بازی آنلاین</title>
<style>


:root{
  --bg:#0f1720; --panel:#182634; --panel2:#1f3040; --line:#2b3f52;
  --text:#eef2f5; --muted:#8fa3b5; --gold:#d4a24c; --gold-d:#a97b30;
  --good:#3fae6a; --bad:#d1483f;
  --c-brown:#8a5a3f; --c-lblue:#6fb7d9; --c-pink:#cf6aa8; --c-orange:#dd8c3f;
  --c-red:#cf4a41; --c-yellow:#dfc548; --c-green:#3fa363; --c-blue:#3f6fc4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#0f1720; --panel:#182634; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'IRANYekan',Tahoma,sans-serif;overscroll-behavior:none}
.brandfont{font-family:'IRANYekan',Tahoma,sans-serif;font-weight:700}
body{display:flex;flex-direction:column;min-height:100%}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;background:var(--panel2);color:var(--text);padding:.6em 1em;font-size:.95rem;transition:.15s}
button:hover:not(:disabled){filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#1a1408;font-weight:700}
button.danger{background:var(--bad)}
h1,h2,h3{margin:0 0 .4em}
.hidden{display:none!important}
.scroll{overflow-y:auto}

/* ---------- Start screen ---------- */
#screen-start{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:520px;width:100%}
.card-box h1{font-size:1.9rem;font-weight:800;background:linear-gradient(90deg,var(--gold),#f0d590);-webkit-background-clip:text;background-clip:text;color:transparent}
.card-box p.sub{color:var(--muted);margin-bottom:1.4em}
.row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.opt-group label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.pillbar{display:flex;gap:6px}
.pill{flex:1;text-align:center;padding:.5em .4em;border-radius:10px;background:var(--panel2);border:2px solid transparent;cursor:pointer;user-select:none}
.pill:hover{filter:brightness(1.15)}
.pill.active{border-color:var(--gold);background:#2a3d2f22;color:var(--gold)}
.diff-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.diff-row span{width:70px;font-size:.85rem;color:var(--muted)}
.start-actions{display:flex;gap:10px;margin-top:18px}
.link-btn{background:none;color:var(--muted);text-decoration:underline;padding:0}

/* ---------- Game layout ---------- */
#screen-game{flex:1;display:flex;flex-direction:column;min-height:0}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
#topbar .brand{font-weight:800;color:var(--gold)}
#topbar .actions{display:flex;gap:8px}
#main{flex:1;display:flex;min-height:0;flex-wrap:wrap}
#board-wrap{flex:1 1 560px;display:flex;align-items:center;justify-content:center;padding:14px;min-width:0}
#board{position:relative;width:min(88vw,72vh,780px);aspect-ratio:1/1;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);background:#12212e;border-radius:10px;border:2px solid var(--line);overflow:visible}
.tile{position:relative;border:1px solid #223347;font-size:clamp(.42rem,1.15vw,.62rem);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:2px;overflow:hidden;background:#152130;text-align:center;line-height:1.05}
.tile .grp{height:16%;width:100%;position:absolute;top:0;left:0}
.tile .nm{position:relative;z-index:1;font-weight:600;padding-top:30%}
.tile .pr{position:relative;z-index:1;color:var(--gold);font-size:.92em}
.tile.corner{font-size:clamp(.5rem,1.3vw,.68rem);justify-content:center}
.tile .icon{font-size:1.35em}
#center{grid-column:2/11;grid-row:2/11;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
#center .logo{font-weight:800;font-size:clamp(1.1rem,3vw,1.9rem);color:var(--gold);letter-spacing:2px;transform:rotate(-8deg)}
#dice{display:flex;gap:8px}

.tokendock{position:absolute;top:1px;left:1px;right:1px;height:26%;display:flex;align-items:center;justify-content:center;gap:2px;z-index:4;flex-wrap:wrap;pointer-events:none}
.token{width:clamp(9px,3.2vw,15px);height:clamp(9px,3.2vw,15px);border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px #000a;display:flex;align-items:center;justify-content:center;font-size:.5em;color:#fff;font-weight:700;flex:0 0 auto}
.house{position:absolute;bottom:1px;left:2px;width:5px;height:5px;background:#3fae6a;border-radius:1px;z-index:3}
.hotel{position:absolute;bottom:1px;left:2px;width:9px;height:7px;background:#d1483f;border-radius:1px;z-index:3}

#side{flex:0 0 340px;max-width:100%;display:flex;flex-direction:column;border-inline-start:1px solid var(--line);background:var(--panel);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px;text-align:center;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;user-select:none}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-color:var(--gold)}
.tabpane{flex:1;overflow-y:auto;padding:12px;min-height:200px}

.player-card{background:var(--panel2);border-radius:12px;padding:10px;margin-bottom:8px;border:2px solid transparent}
.player-card.current{border-color:var(--gold)}
.player-card.bankrupt{opacity:.4;text-decoration:line-through}
.player-card .ph{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.player-card .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:6px}
.player-card .cash{color:var(--gold);font-weight:700}
.player-card .props{font-size:.75rem;color:var(--muted);margin-top:4px}

.log-line{font-size:.82rem;padding:4px 0;border-bottom:1px solid #ffffff10;color:var(--muted)}
.log-line b{color:var(--text)}

#actionbar{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--panel)}
#turninfo{font-size:.85rem;color:var(--muted);padding:0 14px}

.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:.85rem;cursor:pointer}
.pitem button{padding:.3em .7em;font-size:.8rem}
label.pitem, label.pitem *{cursor:pointer}
select{cursor:pointer}
input[type=range]{cursor:pointer}

/* modal */
.modal-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto}
.modal h3{color:var(--gold)}
.modal .close-x{float:left;background:none;color:var(--muted)}

.guide h4{color:var(--gold);margin-top:1em}
.guide p{font-size:.9rem;line-height:1.8;color:#dde5ec}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:#2b3f52;border-radius:4px}
@media(max-width:860px){
  #main{flex-direction:column}
  #side{border-inline-start:none;border-top:1px solid var(--line);flex:1 1 auto;max-height:46vh}
  #board-wrap{padding:8px}
}

#ticker{padding:8px 14px;background:#101b26;border-bottom:1px solid var(--line);font-size:.92rem;min-height:40px;display:flex;align-items:center;position:sticky;top:0;z-index:20}
#ticker.flash{animation:fl .7s}
@keyframes fl{from{background:#4a3a1c}to{background:#101b26}}
.tile{cursor:pointer}
.row2{display:flex;gap:10px;margin:10px 0}.row2>div{flex:1;min-width:0}
#pane-props{display:flex;flex-direction:column;gap:12px}
#pane-props .note{font-size:.78rem;color:var(--muted);line-height:1.8;background:var(--panel2);padding:8px 10px;border-radius:8px}
#side,.tabpane{min-height:0}
#dockbar{background:var(--panel);border-top:1px solid var(--line);z-index:15}
#dockbar #actionbar{border-top:none}
table.rank{width:100%;border-collapse:collapse;font-size:.8rem}
table.rank td,table.rank th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.modal select,.modal input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;font-family:inherit}
.modal h4{margin:14px 0 6px}
@media(min-width:861px){html,body{height:auto}body{min-height:100dvh}#screen-game{flex:none;min-height:100dvh}#side{align-self:flex-start;position:sticky;top:0}.tabpane{max-height:calc(100dvh - 230px);min-height:220px}}
@media(max-width:860px){html,body{height:auto}body{min-height:100dvh}#screen-game{flex:none;min-height:100dvh}#side{max-height:none;height:340px;flex:none}.tabpane{max-height:290px}#dockbar{position:sticky;bottom:0}#topbar{position:sticky;top:0;z-index:21}#ticker{top:52px}}

html{background:radial-gradient(1100px 650px at 12% -8%,#1f4763 0%,transparent 60%),radial-gradient(900px 600px at 100% 105%,#4a3414 0%,transparent 55%),linear-gradient(160deg,#0a1118,#0f1c28 55%,#0a1118);background-attachment:fixed}
body{background:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.09;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='160' viewBox='0 0 600 160'><g fill='%23ffffff'><rect x='10' y='70' width='40' height='90'/><rect x='55' y='40' width='34' height='120'/><rect x='95' y='85' width='50' height='75'/><rect x='150' y='20' width='38' height='140'/><rect x='195' y='60' width='55' height='100'/><rect x='255' y='95' width='36' height='65'/><rect x='296' y='35' width='44' height='125'/><rect x='346' y='75' width='40' height='85'/><rect x='392' y='15' width='34' height='145'/><rect x='432' y='55' width='52' height='105'/><rect x='490' y='90' width='40' height='70'/><rect x='536' y='45' width='50' height='115'/></g></svg>");background-repeat:repeat-x;background-position:bottom;background-size:600px 160px}
#board{background:radial-gradient(circle at 50% 50%,#1f4059 0%,#0f1d2a 72%);box-shadow:0 20px 50px #000a,0 0 0 4px #0c1620}
#center{background:repeating-linear-gradient(45deg,#ffffff08 0 10px,transparent 10px 20px);border-radius:10px}
.tile{background:linear-gradient(180deg,#1b2d40,#132030)}
.tile .nm{padding-top:20%}
#dicestage{display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .3s}
#dicestage.show{transform:scale(1.3)}
#dice{display:flex;gap:14px}
.die{width:clamp(34px,7vw,52px);height:clamp(34px,7vw,52px);background:linear-gradient(145deg,#fff,#d9d9d9);border-radius:22%;box-shadow:0 6px 14px #000a,inset 0 -3px 0 #0002;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:15%;gap:2px}
.die i{border-radius:50%;display:block}.die i.on{background:#151515}
.die.rolling{animation:tumble .34s linear infinite}
.die.land{animation:land .5s ease-out}
@keyframes tumble{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-20px) rotate(90deg)}50%{transform:translateY(0) rotate(180deg)}75%{transform:translateY(-12px) rotate(270deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes land{0%{transform:scale(1.45) rotate(14deg)}60%{transform:scale(.92)}100%{transform:scale(1)}}
#dsum{font-weight:700;color:var(--gold);min-height:1.3em;font-size:clamp(.8rem,1.8vw,1rem)}
#popups{position:absolute;left:14%;right:14%;top:12.5%;display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none}
.pop{background:#0d1620ee;border:1.5px solid var(--gold);border-radius:12px;padding:7px 12px;font-size:clamp(.7rem,1.6vw,.95rem);box-shadow:0 8px 20px #000a;animation:popin .3s ease-out;text-align:center;line-height:1.6}
.pop.out{opacity:0;transform:translateY(-8px);transition:.45s}
@keyframes popin{from{opacity:0;transform:translateY(10px) scale(.94)}}
.token{position:absolute;pointer-events:none;z-index:6;transition:left .2s ease,top .2s ease;width:auto;height:auto;font-size:.7rem}
.token.cur{animation:tp 1s infinite}
@keyframes tp{0%,100%{box-shadow:0 0 0 0 #ffffffaa}50%{box-shadow:0 0 0 6px #ffffff00}}
#pane-log .log-line{overflow-wrap:anywhere}
#side{min-width:0}
</style>
</head>
<body>

<!-- ============ START SCREEN ============ -->
<div id="screen-start">
  <div class="card-box">
    <h1 class="brandfont">مونوپولی 🏙️</h1>
    <p class="sub">بازی مونوپولی آنلاین — کاملاً قابل بازی، با هوش مصنوعی واقعی برای بات‌ها.</p>

    <div class="opt-group">
      <label>چند نفر واقعی دور همین گوشی/سیستم بازی می‌کنید؟ (خودتان و دوستانتان)</label>
      <div class="pillbar" id="human-count">
        <div class="pill" data-v="1">۱ نفره</div>
        <div class="pill active" data-v="2">۲ نفر</div>
        <div class="pill" data-v="3">۳ نفر</div>
        <div class="pill" data-v="4">۴ نفر</div>
      </div>
    </div>

    <div class="opt-group">
      <label>چند بات به بازی اضافه شود؟</label>
      <div class="pillbar" id="bot-count"></div>
      <p id="min-bot-note" class="hidden" style="color:var(--muted);font-size:.78rem;margin:6px 0 0">در حالت تک‌نفره حداقل باید یک بات اضافه کنید.</p>
    </div>

    <div class="opt-group hidden" id="bot-diff-wrap">
      <label>سطح سختی هر بات</label>
      <div id="bot-diffs"></div>
    </div>

    <div class="opt-group">
      <label>پایان بازی (برای کوتاه‌کردن بازی)</label>
      <div class="pillbar" id="end-mode">
        <div class="pill active" data-v="0">تا آخر</div><div class="pill" data-v="15">۱۵ نوبت</div><div class="pill" data-v="25">۲۵ نوبت</div><div class="pill" data-v="40">۴۰ نوبت</div>
      </div>
    </div>
    <div class="start-actions">
      <button class="primary" id="btn-start">شروع بازی</button>
      <button id="btn-guide-start">راهنمای بازی</button>
    </div>
  </div>
</div>

<!-- ============ GAME SCREEN ============ -->
<div id="screen-game" class="hidden">
  <div id="topbar">
    <div class="brand brandfont">مونوپولی</div>
    <div class="actions">
      <button id="btn-guide">📖 راهنما</button>
      <button id="btn-resign">🏳️ انصراف</button>
      <button id="btn-restart">🔄 بازی جدید</button>
    </div>
  </div>

  <div id="ticker">به بازی خوش آمدید</div>
  <div id="main">
    <div id="board-wrap">
      <div id="board"></div>
    </div>
    <div id="side">
      <div class="tabs">
        <div class="tab active" data-t="players">بازیکنان</div>
        <div class="tab" data-t="log">رویدادها</div>
        <div class="tab" data-t="props"><span id="props-tab-label">دارایی من</span></div>
      </div>
      <div class="tabpane" id="pane-players"></div>
      <div class="tabpane hidden" id="pane-log"></div>
      <div class="tabpane hidden" id="pane-props"></div>
    </div>
  </div>

  <div id="dockbar"><div id="turninfo"></div><div id="actionbar"></div></div>
</div>

<!-- ============ MODAL ROOT ============ -->
<div id="modal-root"></div>

  prop("کارخانه سیمان","green",300,[26,130,390,900,1100,1275],200),
  {type:"chest",name:"صندوق اجتماعی"},
  prop("کارخانه خودروسازی","green",320,[28,150,450,1000,1200,1400],200),
  rr("ایستگاه راه‌آهن غرب"),
  {type:"chance",name:"شانس"},
  prop("معدن نقره","blue",350,[35,175,500,1100,1300,1500],200),
  {type:"tax",name:"مالیات لوکس",amount:100},
  prop("معدن طلا","blue",400,[50,200,600,1400,1700,2000],200),
];

const CHANCE_CARDS = [
  {t:"برنده جایزه بانک شدید. ۱۵۰ تومان دریافت کنید.", fn:p=>pay(p,-150)},
  {t:"جریمه تخلف رانندگی. ۴۰ تومان بپردازید.", fn:p=>pay(p,40)},
  {t:"به خانه شروع بروید و ۲۰۰ تومان بگیرید.", fn:p=>{p.pos=0;pay(p,-200)}},
  {t:"مستقیم به زندان بروید.", fn:p=>sendToJail(p)},
  {t:"سه خانه به عقب برگردید.", fn:p=>{p.pos=(p.pos-3+40)%40; resolveTile(p,false)}},
  {t:"کارت آزادی از زندان — نگه دارید تا لازم شود.", fn:p=>{p.jailCards++}},
  {t:"هزینه تعمیرات: به ازای هر خانه ۲۵ و هر هتل ۱۰۰ تومان بپردازید.", fn:p=>{let h=0,ho=0; p.properties.forEach(i=>{const t=state.tiles[i]; if(t.type==="property"){if(t.houses===5)ho++; else h+=t.houses;}}); pay(p,h*25+ho*100)}},
  {t:"به ایستگاه راه‌آهن نزدیک بروید.", fn:p=>{const rrs=[5,15,25,35]; let n=rrs.find(x=>x>p.pos); if(!n)n=rrs[0]; p.pos=n; resolveTile(p,false)}},
];
const CHEST_CARDS = [
  {t:"خطای بانکی به نفع شما. ۲۰۰ تومان دریافت کنید.", fn:p=>pay(p,-200)},
  {t:"هزینه دکتر: ۵۰ تومان بپردازید.", fn:p=>pay(p,50)},
  {t:"از فروش سهام سود کردید. ۱۰۰ تومان دریافت کنید.", fn:p=>pay(p,-100)},
  {t:"هزینه بیمارستان: ۱۰۰ تومان بپردازید.", fn:p=>pay(p,100)},
  {t:"بازگشت مالیات. ۲۵ تومان دریافت کنید.", fn:p=>pay(p,-25)},
  {t:"مستقیم به زندان بروید.", fn:p=>sendToJail(p)},
  {t:"کارت آزادی از زندان — نگه دارید تا لازم شود.", fn:p=>{p.jailCards++}},
  {t:"جشن تولد! از هر بازیکن ۱۰ تومان بگیرید.", fn:p=>{state.players.forEach(o=>{if(o!==p&&!o.bankrupt){transfer(o,p,10)}})}},
];

/* ===================== STATE ===================== */
let state = null;

function newGame(numHumans, botDiffs){
  const tiles = JSON.parse(JSON.stringify(TILES));
  const players = [];
  for(let i=0;i<numHumans;i++){
    const nm = numHumans===1 ? "شما" : "بازیکن "+(i+1)+(i===0?" (شما)":"");
    players.push({id:i,name:nm,isBot:false,cash:1500,pos:0,properties:[],inJail:false,jailTurns:0,bankrupt:false,jailCards:0,doubles:0,turnCount:0,tradeCd:0});
  }
  botDiffs.forEach((d,k)=>{
    const id = numHumans+k;
    players.push({id,name:"بات "+(k+1),isBot:true,difficulty:d,cash:1500,pos:0,properties:[],inJail:false,jailTurns:0,bankrupt:false,jailCards:0,doubles:0,turnCount:0,tradeCd:0});
  });
  state = {
    tiles, players, current:0, phase:"roll", lastDice:[1,1],
    log:[], pendingBuy:null, auction:null, loans:[], over:false, gid:Math.random(), maxTurns:selectedEnd, elimCount:0
  };
  players[0].turnCount=1;
  addLog("بازی شروع شد. نوبت اول: <b>"+players[0].name+"</b>");
  render();
  maybeAutoBotTurn();
}

/* ===================== HELPERS ===================== */
const PACE=1.4;
function later(fn,ms){const g=state&&state.gid;setTimeout(()=>{if(state&&!state.over&&state.gid===g)fn();},ms*PACE);}
function afterAction(p){ if(p.bankrupt) later(()=>{ if(currentPlayer()===p) endTurn(); },900); else if(p.isBot) later(maybeAutoBotTurn,900); }
function popup(html){
  const box=document.getElementById("popups"); if(!box) return;
  const d=document.createElement("div"); d.className="pop"; d.style.borderColor=(state&&P_COLOR[state.current])||"var(--gold)"; d.innerHTML=html;
  box.appendChild(d); while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>d.classList.add("out"),3200); setTimeout(()=>d.remove(),3700);
}
function addLog(html){
  popup(html);
  const tk=document.getElementById("ticker"); if(tk){tk.innerHTML=html;tk.classList.remove("flash");void tk.offsetWidth;tk.classList.add("flash");}
  state.log.unshift(html);
  if(state.log.length>200) state.log.pop();
  renderLog();
}
function activePlayers(){ return state.players.filter(p=>!p.bankrupt); }
function currentPlayer(){ return state.players[state.current]; }

function pay(p, amount){
  // positive amount = player pays bank; negative = player receives
  p.cash -= amount;
  if(p.cash < 0) handleDebt(p, null);
}
function transfer(from, to, amount){
  from.cash -= amount; to.cash += amount;
  if(from.cash < 0) handleDebt(from, to);
}

function groupTiles(group){
  return state.tiles.map((t,i)=>({t,i})).filter(x=>x.t.type==="property"&&x.t.group===group);
}
function ownsFullGroup(player, group){
  return groupTiles(group).every(x=>x.t.owner===player.id);
}
function rentOf(tile, diceSum){
  if(tile.type==="property"){
    if(tile.mortgaged) return 0;
    if(tile.houses>0) return tile.rent[tile.houses];
    const owner = state.players[tile.owner];
    return (ownsFullGroup(owner, tile.group)&&!groupTiles(tile.group).some(x=>x.t.mortgaged)) ? tile.rent[0]*2 : tile.rent[0];
  }
  if(tile.type==="railroad"){
    if(tile.mortgaged) return 0;
    const owner = state.players[tile.owner];
    const n = owner.properties.filter(i=>state.tiles[i].type==="railroad").length;
    return 25*Math.pow(2,n-1);
  }
  if(tile.type==="utility"){
    if(tile.mortgaged) return 0;
    const owner = state.players[tile.owner];
    const n = owner.properties.filter(i=>state.tiles[i].type==="utility").length;
    return diceSum * (n===2?10:4);
  }
  return 0;
}
function propertyValue(tile){
  let v = tile.price;
  if(tile.type==="property") v += tile.houses*tile.houseCost*(tile.houses===5?1:1);
  return v;
}

function handleDebt(player, creditor){
  if(player.isBot && !player._loan){ const need=Math.ceil(-player.cash/50)*50; if(need<=BANK_CAP-bankDebt(player.id)){ player._loan=1; takeLoan(player,null,need,BANK_RATE); player._loan=0; return; } }
  // try to raise cash: sell houses on all groups, then mortgage properties
  let guard=0;
  while(player.cash<0 && guard<200){
    guard++;
    // sell a house from the property with most houses (not hotel-locked logic simplified)
    let best=null;
    player.properties.forEach(i=>{
      const t=state.tiles[i];
      if(t.type==="property" && t.houses>0){
        if(!best || t.houses>state.tiles[best].houses) best=i;
      }
    });
    if(best!==null){
      const t=state.tiles[best];
      player.cash += Math.floor(t.houseCost/2);
      t.houses--;
      continue;
    }
    let mort=null;
    player.properties.forEach(i=>{
      const t=state.tiles[i];
      if(!t.mortgaged && t.houses===0){ mort=i; }
    });
    if(mort!==null){
      const t=state.tiles[mort];
      t.mortgaged=true;
      player.cash += Math.floor(t.price/2);
      continue;
    }
    break;
  }
  if(player.cash<0){
    declareBankrupt(player, creditor);
  }
}

function declareBankrupt(player, creditor){
  if(player.bankrupt) return;
  player.bankrupt=true; player.outAt=++state.elimCount;
  state.loans=state.loans.filter(l=>l.borrower!==player.id);
  state.loans.forEach(l=>{if(l.lender===player.id)l.lender=creditor?creditor.id:undefined;}); state.loans=state.loans.filter(l=>l.lender!==undefined);
  addLog("💀 <b>"+player.name+"</b> ورشکسته شد!");
  player.properties.forEach(i=>{
    const t=state.tiles[i];
    if(creditor){
      t.owner=creditor.id; creditor.properties.push(i);
    } else {
      t.owner=null; t.houses=0; t.mortgaged=false;
    }
  });
  player.properties=[];
  checkWin();
}
function checkWin(){ if(activePlayers().length<=1) endGame("فقط یک بازیکن باقی ماند"); }

function sendToJail(p){
  p.pos=10; p.inJail=true; p.jailTurns=0; p.doubles=0;
  addLog(p.name+" به زندان فرستاده شد.");
  render();
}

/* ===================== TURN FLOW ===================== */
function rollDiceVals(){ return [1+Math.floor(Math.random()*6), 1+Math.floor(Math.random()*6)]; }

function doRoll(){
  if(state.over||state.phase!=="roll") return;
  const p = currentPlayer();
  if(p.bankrupt) return;
  state.phase="moving";
  const [d1,d2] = rollDiceVals();
  state.lastDice=[d1,d2];
  addLog("🎲 <b>"+p.name+"</b> تاس می‌اندازد...");
  render();
  const g=state.gid;
  animateDice(d1,d2,()=>{ if(state.over||state.gid!==g) return; afterRoll(p,d1,d2); });
}
function afterRoll(p,d1,d2){
  const isDouble = d1===d2;
  if(p.inJail){
    if(isDouble){
      p.inJail=false; p.jailTurns=0;
      addLog("🔓 "+p.name+" با تاس دوبل ("+d1+"،"+d2+") از زندان آزاد شد.");
      movePlayer(p, d1+d2);
    } else {
      p.jailTurns++;
      if(p.jailTurns>=3){
        pay(p,50);
        p.inJail=false; p.jailTurns=0;
        addLog("🔓 "+p.name+" پس از ۳ نوبت، ۵۰ تومان پرداخت کرد و آزاد شد.");
        movePlayer(p, d1+d2);
      } else {
        addLog("🔒 "+p.name+" تاس "+d1+" و "+d2+" آورد و در زندان ماند.");
        state.phase="end";
        render(); maybeAutoBotTurn();
      }
    }
    return;
  }
  addLog(p.name+" تاس آورد: <b>"+d1+" و "+d2+"</b> (مجموع "+(d1+d2)+")"+(isDouble?" — 🎉 دوبل! یک بار دیگر تاس می‌اندازد":""));
  if(isDouble){
    p.doubles++;
    if(p.doubles>=3){
      addLog("🚨 "+p.name+" سه دوبل پشت سر هم آورد! مستقیم به زندان.");
      p.doubles=0; sendToJail(p);
      state.phase="end"; render(); maybeAutoBotTurn();
      return;
    }
  } else { p.doubles=0; }
  movePlayer(p, d1+d2, isDouble);
}

function movePlayer(p, steps, isDouble){
  const g=state.gid;
  const step=(left)=>{
    if(state.over||state.gid!==g) return;
    p.pos=(p.pos+1)%40;
    if(p.pos===0){ pay(p,-200); addLog("💰 "+p.name+" از خانه شروع رد شد و ۲۰۰ تومان گرفت."); }
    render();
    if(left>1) later(()=>step(left-1),170); else later(()=>resolveTile(p,isDouble),450);
  };
  step(steps);
}

function resolveTile(p, isDouble){
  if(state.over||(state.phase!=="moving"&&state.phase!=="action")) return;
  if(p.bankrupt){ endTurnAuto(); return; }
  const t = state.tiles[p.pos];
  addLog(p.name+" روی «"+t.name+"» فرود آمد.");
  state.phase="action";

  if(t.type==="go" || t.type==="jail" || t.type==="free"){
    state.phase = isDouble? "roll":"end";
  } else if(t.type==="gotojail"){
    sendToJail(p); state.phase="end";
  } else if(t.type==="tax"){
    pay(p, t.amount);
    addLog(p.name+" مالیات "+t.amount+" تومان پرداخت کرد.");
    state.phase = isDouble? "roll":"end";
  } else if(t.type==="chance" || t.type==="chest"){
    const deck = t.type==="chance"?CHANCE_CARDS:CHEST_CARDS;
    const card = deck[Math.floor(Math.random()*deck.length)];
    addLog("🎴 "+card.t);
    showModal(t.type==="chance"?"کارت شانس":"کارت صندوق اجتماعی", "<p style='font-size:1.05rem'>"+card.t+"</p><button class='primary' id='card-ok'>باشه</button>");
    document.getElementById("card-ok").onclick=()=>{
      closeModal();
      state.phase="action";
      card.fn(p);
      if(state.phase==="action") state.phase = isDouble? "roll":"end";
      render();
      afterAction(p);
    };
    if(p.isBot) later(()=>{const b=document.getElementById("card-ok"); if(b) b.click();},2200);
    render();
    return;
  } else if(t.type==="property" || t.type==="railroad" || t.type==="utility"){
    if(t.owner===null){
      state.pendingBuy = p.pos;
      state.phase="buy-decision";
      if(p.isBot){
        addLog("🤔 "+p.name+" در حال بررسی خرید «"+t.name+"» ("+t.price+" تومان، موجودی "+p.cash+")...");
        later(()=>botBuyDecision(p, t), 1800);
      }
    } else if(t.owner===p.id){
      state.phase = isDouble? "roll":"end";
    } else {
      const owner = state.players[t.owner];
      if(t.mortgaged){
        state.phase = isDouble? "roll":"end";
      } else {
        const rentAmt = rentOf(t, state.lastDice[0]+state.lastDice[1]);
        transfer(p, owner, rentAmt);
        addLog(p.name+" اجاره <b>"+rentAmt+"</b> تومان به "+owner.name+" پرداخت کرد.");
        state.phase = isDouble? "roll":"end";
      }
    }
  }
  render();
  if(state.phase==="end") maybeAutoBotTurn();
  else if(state.phase==="roll" && p.isBot) later(doRoll, 1500);
}

function buyProperty(){
  if(state.phase!=="buy-decision"||state.pendingBuy===null) return;
  const p = currentPlayer();
  const t = state.tiles[state.pendingBuy];
  if(p.cash < t.price) return;
  p.cash -= t.price; t.owner = p.id; p.properties.push(state.pendingBuy);
  addLog(p.name+" «"+t.name+"» را به قیمت "+t.price+" خرید.");
  state.pendingBuy=null;
  const wasDouble = state.lastDice[0]===state.lastDice[1] && !p.inJail;
  state.phase = wasDouble? "roll":"end";
  render();
  if(p.isBot||state.phase==="end") maybeAutoBotTurn();
}
function declineBuy(){
  if(state.phase!=="buy-decision"||state.pendingBuy===null) return;
  const idx = state.pendingBuy;
  addLog(currentPlayer().name+" از خرید صرف‌نظر کرد. مزایده شروع می‌شود.");
  state.pendingBuy=null;
  startAuction(idx);
}

function botBuyDecision(p, t){
  const strat = {easy:0.55, medium:0.75, hard:0.9}[p.difficulty] || 0.7;
  const groupBonus = (t.type==="property" && groupTiles(t.group).some(x=>x.t.owner===p.id)) ? 0.2 : 0;
  const affordMargin = p.cash - t.price;
  const willBuy = affordMargin > 100 && (Math.random() < strat+groupBonus || affordMargin > t.price*2);
  if(willBuy && p.cash>=t.price){ buyProperty(); }
  else { declineBuy(); }
}

/* ---------- Auction ---------- */
function startAuction(tileIdx){
  const t = state.tiles[tileIdx];
  const bidders = activePlayers().map(p=>p.id);
  state.auction = {tileIdx, bidders, highBid:0, highBidder:null, turnIdx:(bidders.indexOf(state.current)+1)%bidders.length};
  state.phase="auction";
  render();
  runAuctionStep();
}
function runAuctionStep(){
  const a = state.auction;
  if(!a||state.over) return;
  if(a.bidders.length===0||(a.bidders.length===1&&a.highBidder!==null)){
    finishAuction(); return;
  }
  const pid = a.bidders[a.turnIdx % a.bidders.length];
  const player = state.players[pid];
  if(pid===a.highBidder){ finishAuction(); return; }
  if(player.isBot){
    addLog("🔨 مزایده: نوبت "+player.name+" (بالاترین پیشنهاد: "+a.highBid+")");
    later(()=>{
      const t = state.tiles[a.tileIdx];
      const strat = {easy:0.5, medium:0.75, hard:1.0}[player.difficulty]||0.7;
      const maxBid = Math.min(player.cash-50, Math.floor(t.price*strat));
      if(a.highBid+10 <= maxBid && Math.random()<0.8){
        a.highBid+=10; a.highBidder=pid; a.turnIdx++;
        addLog(player.name+" در مزایده "+a.highBid+" پیشنهاد داد.");
      } else {
        a.bidders = a.bidders.filter(x=>x!==pid);
        addLog(player.name+" از مزایده کنار رفت.");
      }
      render();
      runAuctionStep();
    }, 1100);
  } else {
    render(); // wait for human buttons
  }
}
function humanBid(pid,inc=10){
  const a = state.auction;
  const player = state.players[pid];
  if(player.cash < a.highBid+inc) return;
  a.highBid+=inc; a.highBidder=pid;
  addLog(player.name+" در مزایده "+a.highBid+" پیشنهاد داد.");
  a.turnIdx++;
  render();
  runAuctionStep();
}
function humanFold(pid){
  const a = state.auction;
  const player = state.players[pid];
  a.bidders = a.bidders.filter(x=>x!==pid);
  addLog(player.name+" از مزایده کنار رفت.");
  render();
  runAuctionStep();
}
function finishAuction(){
  const a = state.auction;
  const t = state.tiles[a.tileIdx];
  if(a.highBidder!==null){
    const w = state.players[a.highBidder];
    w.cash -= a.highBid; t.owner=w.id; w.properties.push(a.tileIdx);
    addLog(w.name+" ملک «"+t.name+"» را در مزایده به قیمت "+a.highBid+" برد.");
  } else {
    addLog("هیچ‌کس در مزایده شرکت نکرد.");
  }
  state.auction=null;
  const p = currentPlayer();
  const wasDouble = state.lastDice[0]===state.lastDice[1] && !p.inJail;
  state.phase = wasDouble? "roll":"end";
  render();
  if(state.phase==="end") maybeAutoBotTurn();
  else if(p.isBot) later(doRoll,1200);
}

/* ---------- Houses ---------- */
function buildHouse(tileIdx){
  const p = currentPlayer();
  const t = state.tiles[tileIdx];
  if(t.owner!==p.id || !ownsFullGroup(p,t.group) || t.houses>=5) return;
  if(groupTiles(t.group).some(x=>x.t.mortgaged)) return;
  const groupT = groupTiles(t.group).map(x=>x.t);
  const minHouses = Math.min(...groupT.map(g=>g.houses));
  if(t.houses>minHouses) return; // even building rule
  if(p.cash < t.houseCost) return;
  p.cash -= t.houseCost; t.houses++;
  addLog(p.name+" روی «"+t.name+"» "+(t.houses===5?"هتل ساخت":"خانه ساخت")+".");
  render();
}
function sellHouse(tileIdx){
  const p = currentPlayer();
  const t = state.tiles[tileIdx];
  if(t.owner!==p.id || t.houses<=0) return;
  const groupT = groupTiles(t.group).map(x=>x.t);
  const maxHouses = Math.max(...groupT.map(g=>g.houses));
  if(t.houses<maxHouses) return;
  p.cash += Math.floor(t.houseCost/2); t.houses--;
  render();
}
function toggleMortgage(tileIdx){
  const p = currentPlayer();
  const t = state.tiles[tileIdx];
  if(t.owner!==p.id || t.houses>0 || (t.type==="property"&&groupTiles(t.group).some(x=>x.t.houses>0))) return;
  if(!t.mortgaged){
    t.mortgaged=true; p.cash += Math.floor(t.price/2);
    addLog(p.name+" «"+t.name+"» را در رهن گذاشت (+"+Math.floor(t.price/2)+")");
  } else {
    const cost = Math.ceil(t.price/2*1.1);
    if(p.cash<cost) return;
    p.cash -= cost; t.mortgaged=false;
    addLog(p.name+" رهن «"+t.name+"» را آزاد کرد (-"+cost+")");
  }
  render();
}

/* ---------- Jail actions ---------- */
function payJailFine(){
  const p = currentPlayer();
  if(p.cash<50) return;
  pay(p,50); p.inJail=false; p.jailTurns=0;
  addLog(p.name+" ۵۰ تومان جریمه پرداخت کرد و آزاد شد.");
  state.phase="roll";
  render();
}
function useJailCard(){
  const p = currentPlayer();
  if(p.jailCards<=0) return;
  p.jailCards--; p.inJail=false; p.jailTurns=0;
  addLog(p.name+" از کارت آزادی زندان استفاده کرد.");
  state.phase="roll";
  render();
}

/* ---------- End turn / bots ---------- */
function endTurn(){
  if(state.over) return;
  const p = currentPlayer();
  p.doubles=0;
  if(state.maxTurns && activePlayers().every(x=>x.turnCount>=state.maxTurns)){ endGame("همه بازیکنان "+persianNum(state.maxTurns)+" نوبت بازی کردند"); return; }
  let next = state.current;
  do{ next=(next+1)%state.players.length; } while(state.players[next].bankrupt);
  state.current = next;
  state.phase="roll";
  const np=currentPlayer(); np.turnCount++;
  addLog("— نوبت <b>"+np.name+"</b> —");
  state.loans.filter(l=>l.borrower===np.id&&l.due<=np.turnCount).forEach(repayLoan);
  if(np.bankrupt){ if(!state.over) endTurn(); return; }
  render();
  maybeAutoBotTurn();
}
function endTurnAuto(){ endTurn(); }

function maybeAutoBotTurn(){
  if(state.over) return;
  const p = currentPlayer();
  if(p.bankrupt){ endTurn(); return; }
  if(state.phase==="roll" && p.isBot){
    if(p.inJail) botJail(p);
    botBuildPass(p);
    const go=()=>later(doRoll,1500);
    if(p.lastTradeTurn!==p.turnCount){ p.lastTradeTurn=p.turnCount; botTradePass(p,go); } else go();
  } else if(state.phase==="end" && p.isBot){
    { const cid=state.current; later(()=>{ if(state.phase==="end"&&state.current===cid) endTurn(); },1900); }
  }
}
function botJail(p){ if(p.jailCards>0) useJailCard(); else if(p.cash>350&&p.difficulty!=="easy") payJailFine(); }
function botBuildPass(p){
  const groups = [...new Set(p.properties.map(i=>state.tiles[i].group).filter(Boolean))];
  groups.forEach(g=>{
    if(!ownsFullGroup(p,g)) return;
    let guard=0;
    while(p.cash > 250 && guard<6){
      guard++;
      const gts = groupTiles(g).map(x=>x.t);
      const minH = Math.min(...gts.map(x=>x.houses));
      const cand = gts.find(x=>x.houses===minH && x.houses<5);
      if(!cand || p.cash<cand.houseCost+150) break;
      p.cash -= cand.houseCost; cand.houses++;
      addLog(p.name+" روی «"+cand.name+"» "+(cand.houses===5?"هتل ساخت":"خانه ساخت")+".");
    }
  });
}

/* ===================== TRADE (negotiation) ===================== */
const other=(tr,id)=>id===tr.a?tr.b:tr.a;
const propNames=l=>l.length?l.map(i=>state.tiles[i].name).join("، "):"—";
const MORT_NOTE='<div class="note">💡 <b>رهن:</b> ملک بدون ساختمان را رهن بگذارید تا نصف قیمتش را نقد بگیرید (اجاره‌اش قطع می‌شود). <b>آزادسازی:</b> نصف قیمت + ۱۰٪ سود. ساختمان‌ها را می‌توان به نصف قیمت فروخت.</div>';
function tradable(p){return p.properties.filter(i=>{const t=state.tiles[i];return !(t.type==="property"&&groupTiles(t.group).some(x=>x.t.houses>0));});}
function openTradeModal(){
  const me=currentPlayer(); if(me.isBot) return;
  const o=activePlayers().filter(p=>p.id!==me.id); if(!o.length) return;
  tradeEditor({a:me.id,b:o[0].id,aProps:[],bProps:[],cash:0,round:0,turn:o[0].id,cb:null},true);
}
function readEditor(tr){
  const g=c=>[...document.querySelectorAll(c+":checked")].map(x=>+x.dataset.i);
  tr.aProps=g(".ca"); tr.bProps=g(".cb");
  const amt=Math.max(0,parseInt(document.getElementById("tr-amt").value)||0);
  tr.cash=(+document.getElementById("tr-payer").value===tr.a)?amt:-amt;
}
function tradeEditor(tr,first){
  const A=state.players[tr.a],B=state.players[tr.b];
  const others=activePlayers().filter(p=>p.id!==tr.a);
  const list=(pl,sel,cls)=>{const l=tradable(pl);return l.length?l.map(i=>`<label class="pitem"><span><input type="checkbox" class="${cls}" data-i="${i}" ${sel.includes(i)?"checked":""}> ${state.tiles[i].name}${state.tiles[i].mortgaged?" (رهن)":""}</span></label>`).join(""):"<small>ملک قابل معامله ندارد</small>";};
  const payer=tr.cash<0?tr.b:tr.a, amt=Math.abs(tr.cash);
  showModal(first?"پیشنهاد معامله":"تغییر پیشنهاد",`
  ${first?`<label>طرف مقابل: </label><select id="tr-b">${others.map(o=>`<option value="${o.id}" ${o.id===tr.b?"selected":""}>${o.name}</option>`).join("")}</select>`:`<p><b>${A.name}</b> ↔ <b>${B.name}</b> (دور ${tr.round})</p>`}
  <div class="row2"><div><b>${A.name} می‌دهد</b><div class="plist">${list(A,tr.aProps,"ca")}</div></div><div><b>${B.name} می‌دهد</b><div class="plist">${list(B,tr.bProps,"cb")}</div></div></div>
  <label>پول اضافه: <select id="tr-payer"><option value="${tr.a}" ${payer===tr.a?"selected":""}>${A.name} می‌پردازد</option><option value="${tr.b}" ${payer===tr.b?"selected":""}>${B.name} می‌پردازد</option></select> <input id="tr-amt" type="number" min="0" step="10" value="${amt}" style="width:90px"></label>
  <div id="tr-err" style="color:var(--bad);font-size:.85rem;margin-top:6px"></div>
  <div class="start-actions"><button class="primary" id="tr-send">ارسال پیشنهاد</button><button id="tr-cancel">${first?"انصراف":"بازگشت"}</button></div>`);
  if(first) document.getElementById("tr-b").onchange=e=>{readEditor(tr);tr.b=+e.target.value;tr.bProps=[];tr.turn=tr.b;tradeEditor(tr,true);};
  document.getElementById("tr-cancel").onclick=()=>first?closeModal():tradeShow(tr);
  document.getElementById("tr-send").onclick=()=>{
    readEditor(tr);
    const err=(!tr.aProps.length&&!tr.bProps.length&&tr.cash===0)?"پیشنهاد خالی است.":tradeValid(tr);
    if(err){document.getElementById("tr-err").textContent=err;return;}
    const from=first?tr.a:tr.turn;
    tr.round++; tr.turn=first?tr.b:other(tr,tr.turn);
    addLog("🤝 "+state.players[from].name+" پیشنهاد معامله به "+state.players[tr.turn].name+" داد.");
    tradeRespond(tr);
  };
}
function tradeValid(tr){
  const A=state.players[tr.a],B=state.players[tr.b];
  if(A.bankrupt||B.bankrupt) return "یکی از بازیکنان از بازی خارج شده است.";
  if(tr.aProps.some(i=>state.tiles[i].owner!==A.id)||tr.bProps.some(i=>state.tiles[i].owner!==B.id)) return "مالکیت املاک تغییر کرده است.";
  if([...tr.aProps,...tr.bProps].some(i=>!tradable({properties:[i]}).length)) return "ملک دارای ساختمان (یا هم‌رنگ ساخته‌شده) قابل معامله نیست.";
  const amt=Math.abs(tr.cash),payer=tr.cash>0?A:B; if(payer.cash<amt) return payer.name+" پول کافی ندارد.";
  return "";
}
function tradeExec(tr){
  const A=state.players[tr.a],B=state.players[tr.b];
  addLog("✅ معامله: "+A.name+" ("+propNames(tr.aProps)+") ↔ "+B.name+" ("+propNames(tr.bProps)+") | پول: "+(tr.cash===0?"—":(tr.cash>0?A.name:B.name)+" "+Math.abs(tr.cash)));
  const fees=[];
  const mv=(list,from,to)=>list.forEach(i=>{const t=state.tiles[i];t.owner=to.id;from.properties=from.properties.filter(x=>x!==i);to.properties.push(i);if(t.mortgaged)fees.push([to,Math.ceil(t.price/2*0.1)]);});
  mv(tr.aProps,A,B); mv(tr.bProps,B,A);
  if(tr.cash>0){A.cash-=tr.cash;B.cash+=tr.cash;}else{B.cash+=tr.cash;A.cash-=tr.cash;}
  fees.forEach(([p,f])=>pay(p,f));
}
function tradeRespond(tr){
  const rp=state.players[tr.turn],pr=state.players[other(tr,tr.turn)];
  if(!rp.isBot){ tradeShow(tr); return; }
  if(!pr.isBot) showModal("مذاکره","<p>"+rp.name+" در حال بررسی پیشنهاد شما...</p>");
  later(()=>tradeAI(tr),1300);
}
function tradeShow(tr){
  const A=state.players[tr.a],B=state.players[tr.b],rp=state.players[tr.turn];
  const cashTxt=tr.cash===0?"بدون پول اضافه":(tr.cash>0?A.name:B.name)+" مبلغ <b>"+Math.abs(tr.cash)+"</b> تومان اضافه می‌پردازد";
  showModal("پیشنهاد معامله برای "+rp.name,`<p>${A.name} می‌دهد: <b>${propNames(tr.aProps)}</b></p><p>${B.name} می‌دهد: <b>${propNames(tr.bProps)}</b></p><p>${cashTxt}</p><small>دور ${tr.round}</small>
  <div class="start-actions"><button class="primary" id="t-ok">قبول</button><button id="t-ed">تغییر پیشنهاد</button><button class="danger" id="t-no">رد</button></div>`);
  document.getElementById("t-ok").onclick=()=>{
    const e=tradeValid(tr);
    if(e){showModal("خطا","<p>"+e+"</p><button class='primary' id='t-back'>بازگشت</button>");document.getElementById("t-back").onclick=()=>tradeShow(tr);return;}
    tradeExec(tr); tradeFinish(tr,"🤝 "+rp.name+" پیشنهاد را قبول کرد و معامله انجام شد.");
  };
  document.getElementById("t-ed").onclick=()=>tradeEditor(tr,false);
  document.getElementById("t-no").onclick=()=>tradeFinish(tr,"❌ "+rp.name+" پیشنهاد را رد کرد.");
}
function tradeFinish(tr,msg){
  addLog(msg); render();
  const hum=!state.players[tr.a].isBot||!state.players[tr.b].isBot;
  if(hum){ showModal("نتیجه مذاکره","<p>"+msg+"</p><button class='primary' id='tf-ok'>باشه</button>"); document.getElementById("tf-ok").onclick=()=>{closeModal(); if(tr.cb)tr.cb();}; }
  else if(tr.cb) later(tr.cb,900);
}
function aiVal(bot,i){
  const t=state.tiles[i]; let v=t.price*(t.mortgaged?0.6:1);
  if(t.type==="property"){const g=groupTiles(t.group),m=g.filter(x=>x.t.owner===bot.id).length; if(m===g.length-1) v*=1.8; else if(m>=1) v*=1.25;}
  return v;
}
function aiLoss(bot,i,opp){
  const t=state.tiles[i]; let v=aiVal(bot,i);
  if(t.type==="property"){const g=groupTiles(t.group); if(g.filter(x=>x.t.owner===bot.id).length===g.length) v*=2; if(g.filter(x=>x.t.owner===opp.id).length===g.length-1) v*=1.8;}
  return v;
}
function aiRespond(tr){
  const bot=state.players[tr.turn],opp=state.players[other(tr,tr.turn)],isA=bot.id===tr.a;
  const give=isA?tr.aProps:tr.bProps,get=isA?tr.bProps:tr.aProps,net=isA?-tr.cash:tr.cash;
  const gain=get.reduce((s,i)=>s+aiVal(bot,i),0)+Math.max(net,0);
  const loss=give.reduce((s,i)=>s+aiLoss(bot,i,opp),0)+Math.max(-net,0);
  const need=loss*({easy:.9,medium:1.05,hard:1.25}[bot.difficulty]||1);
  if(gain+loss===0) return "reject";
  if(gain>=need&&bot.cash+net>=60) return "accept";
  const gap=Math.ceil((need-gain)/10)*10, nn=net+gap;
  if(tr.round<7&&gap<=need*0.5&&(nn>0?opp.cash>=nn:bot.cash>=-nn)&&bot.cash+nn>=60){tr.cash=isA?-nn:nn;return "counter";}
  return "reject";
}
function tradeAI(tr){
  const r=aiRespond(tr),rp=state.players[tr.turn],pr=state.players[other(tr,tr.turn)];
  if(r==="accept"){const e=tradeValid(tr);if(e)return tradeFinish(tr,"⚠️ معامله انجام نشد: "+e);tradeExec(tr);return tradeFinish(tr,"🤝 "+rp.name+" پیشنهاد را قبول کرد و معامله انجام شد.");}
  if(r==="counter"){tr.round++;tr.turn=pr.id;addLog("↩️ "+rp.name+" پیشنهاد جدید (متقابل) داد.");if(tr.round>8)return tradeFinish(tr,"مذاکره بی‌نتیجه ماند.");return tradeRespond(tr);}
  tradeFinish(tr,"❌ "+rp.name+" پیشنهاد را رد کرد.");
}
function botTradePass(bot,done){
  if(bot.tradeCd>0){bot.tradeCd--;return done();}
  let best=null;
  [...new Set(state.tiles.filter(t=>t.type==="property").map(t=>t.group))].forEach(g=>{
    const gt=groupTiles(g),mine=gt.filter(x=>x.t.owner===bot.id).length,miss=gt.filter(x=>x.t.owner!==bot.id);
    if(mine===gt.length-1&&miss.length===1&&miss[0].t.owner!==null&&!state.players[miss[0].t.owner].bankrupt&&!miss[0].t.mortgaged) best={i:miss[0].i,o:state.players[miss[0].t.owner]};
  });
  if(!best||Math.random()>0.6) return done();
  const t=state.tiles[best.i],mult={easy:1.2,medium:1.5,hard:1.7}[bot.difficulty]||1.4;
  const cash=Math.min(Math.round(t.price*mult/10)*10,bot.cash-100); if(cash<40) return done();
  bot.tradeCd=3;
  const tr={a:bot.id,b:best.o.id,aProps:[],bProps:[best.i],cash:cash,round:1,turn:best.o.id,cb:done};
  if(tradeValid(tr)) return done();
  addLog("🤝 "+bot.name+" برای «"+t.name+"» به "+best.o.name+" مبلغ "+cash+" تومان پیشنهاد داد.");
  tradeRespond(tr);
}
function showTileInfo(i){
  const t=state?state.tiles[i]:TILES[i];
  if(!["property","railroad","utility"].includes(t.type)) return;
  let h=`<p>قیمت: <b>${t.price}</b> — رهن: ${t.price/2}</p>`;
  if(t.type==="property") h+=`<p>اجاره‌ی پایه: ${t.rent[0]}<br>مالکیت کامل دسته (بدون ساختمان): ${t.rent[0]*2}<br>۱ خانه: ${t.rent[1]} | ۲ خانه: ${t.rent[2]}<br>۳ خانه: ${t.rent[3]} | ۴ خانه: ${t.rent[4]}<br>هتل: <b>${t.rent[5]}</b><br>هزینه‌ی ساخت هر خانه/هتل: ${t.houseCost}</p>`;
  else if(t.type==="railroad") h+="<p>اجاره: با ۱ ایستگاه ۲۵، ۲ ایستگاه ۵۰، ۳ ایستگاه ۱۰۰، ۴ ایستگاه ۲۰۰</p>";
  else h+="<p>اجاره: ۴ برابر تاس (یک شرکت) یا ۱۰ برابر تاس (هر دو شرکت)</p>";
  if(t.owner!==null&&t.owner!==undefined) h+=`<p>مالک: <b>${state.players[t.owner].name}</b>${t.houses?" — ساختمان: "+(t.houses===5?"هتل":t.houses+" خانه"):""}${t.mortgaged?" (رهنی)":""}</p>`;
  showModal(t.name,h+"<button class='primary' onclick='closeModal()'>بستن</button>");
}

/* ===================== LOANS ===================== */
const BANK_RATE=0.1, BANK_CAP=1000;
function bankDebt(pid){return state.loans.filter(l=>l.borrower===pid&&l.lender===null).reduce((s,l)=>s+l.principal,0);}
function takeLoan(b,lender,amount,rate){
  b.cash+=amount; if(lender) lender.cash-=amount;
  state.loans.push({borrower:b.id,lender:lender?lender.id:null,principal:amount,rate,due:b.turnCount+1});
  addLog("🏦 "+b.name+" مبلغ "+amount+" تومان وام از "+(lender?lender.name:"بانک")+" گرفت (سود "+Math.round(rate*100)+"٪؛ سررسید: ابتدای نوبت بعدی).");
}
function repayLoan(l){
  const b=state.players[l.borrower],amt=Math.round(l.principal*(1+l.rate)),lender=l.lender===null?null:state.players[l.lender];
  state.loans=state.loans.filter(x=>x!==l);
  addLog("💳 "+b.name+" وام "+amt+" تومانی ("+(lender?lender.name:"بانک")+") را پرداخت می‌کند.");
  if(lender&&!lender.bankrupt) transfer(b,lender,amt); else pay(b,amt);
}
function info(msg){addLog(msg);showModal("پیام","<p>"+msg+"</p><button class='primary' onclick='closeModal();render()'>باشه</button>");}
function earlyRepay(k){const l=state.loans[k];if(!l)return;const amt=Math.round(l.principal*(1+l.rate));if(state.players[l.borrower].cash<amt){info("پول کافی برای پرداخت نیست.");return;}repayLoan(l);closeModal();render();}
function openLoanModal(){
  const me=currentPlayer(); if(me.isBot) return;
  const left=BANK_CAP-bankDebt(me.id),others=activePlayers().filter(p=>p.id!==me.id);
  const lt=state.loans.map((l,k)=>({l,k})).filter(x=>x.l.borrower===me.id||x.l.lender===me.id).map(({l,k})=>`<div class="pitem"><span>${state.players[l.borrower].name} ← ${l.lender===null?"بانک":state.players[l.lender].name}: ${l.principal} + ${Math.round(l.rate*100)}٪ = <b>${Math.round(l.principal*(1+l.rate))}</b></span>${l.borrower===me.id?`<button onclick="earlyRepay(${k})">پرداخت</button>`:""}</div>`).join("")||"<small>وام فعالی ندارید.</small>";
  const d0=Math.min(300,left);
  showModal("وام",`<div class="plist">${lt}</div>
  <h4 style="color:var(--gold)">وام از بانک (سود ثابت ${BANK_RATE*100}٪ — سقف کل ${BANK_CAP})</h4>
  ${left>=100?`<input type="range" id="bl-amt" min="100" max="${left}" step="50" value="${d0}" style="width:100%" oninput="document.getElementById('bl-txt').textContent=this.value+' ← بازپرداخت '+Math.round(this.value*${1+BANK_RATE})"><div id="bl-txt">${d0} ← بازپرداخت ${Math.round(d0*(1+BANK_RATE))}</div><button class="primary" id="bl-go">دریافت از بانک</button>`:"<small>به سقف وام بانکی رسیده‌اید.</small>"}
  <h4 style="color:var(--gold)">وام از بازیکن (سود ۱۵٪ تا ۵۰٪)</h4>
  ${others.length?`<select id="pl-lender">${others.map(o=>`<option value="${o.id}">${o.name}</option>`).join("")}</select> <input id="pl-amt" type="number" min="50" step="50" value="200" style="width:90px"> <select id="pl-rate">${[15,20,25,30,35,40,45,50].map(r=>`<option value="${r}">${r}٪</option>`).join("")}</select> <button id="pl-go">ارسال درخواست</button>`:"<small>بازیکن دیگری نیست.</small>"}
  <p style="font-size:.78rem;color:var(--muted)">سررسید: ابتدای نوبت بعدی شما (پس از یک دور کامل)؛ مبلغ + سود خودکار کسر می‌شود.</p>
  <button onclick="closeModal()">بستن</button>`);
  const bg=document.getElementById("bl-go"); if(bg) bg.onclick=()=>{const a=+document.getElementById("bl-amt").value;if(a>left||a<100)return;takeLoan(me,null,a,BANK_RATE);closeModal();render();};
  const pg=document.getElementById("pl-go"); if(pg) pg.onclick=()=>{const a=parseInt(document.getElementById("pl-amt").value)||0;if(a<50)return;loanRequest(me,state.players[+document.getElementById("pl-lender").value],a,+document.getElementById("pl-rate").value/100);};
}
function loanRequest(b,l,amt,rate){
  if(l.cash<amt+100){info(l.name+" پول کافی برای این وام ندارد.");return;}
  const back=Math.round(amt*(1+rate));
  if(l.isBot){
    const ok=netWorth(b)>=amt*1.5&&rate>=({easy:.15,medium:.2,hard:.3}[l.difficulty]||.2)&&l.cash>=amt+150;
    if(ok){takeLoan(b,l,amt,rate);info(l.name+" وام را پذیرفت.");}else info(l.name+" درخواست وام را رد کرد (سود کم است یا اعتبار کافی نیست).");
    return;
  }
  showModal("درخواست وام برای "+l.name,`<p>${b.name} مبلغ ${amt} تومان با سود ${Math.round(rate*100)}٪ می‌خواهد (بازپرداخت ${back} در ابتدای نوبت بعدی او).</p><div class="start-actions"><button class="primary" id="lr-y">می‌دهم</button><button id="lr-n">نمی‌دهم</button></div>`);
  document.getElementById("lr-y").onclick=()=>{takeLoan(b,l,amt,rate);info(l.name+" وام را داد.");};
  document.getElementById("lr-n").onclick=()=>info(l.name+" درخواست وام را رد کرد.");
}

/* ===================== RESIGN / END ===================== */
function openResign(){
  if(!state||state.over) return;
  const p=currentPlayer();
  if(p.isBot||!(state.phase==="roll"||state.phase==="end")){info("انصراف فقط در نوبت خودتان (قبل از تاس یا بعد از حرکت) ممکن است.");return;}
  const o=activePlayers().filter(x=>x.id!==p.id);
  showModal("انصراف از بازی",`<p>${p.name}، با انصراف از بازی خارج می‌شوید.</p>
  ${o.length?`<label>واگذاری همه‌ی املاک و پول به: </label><select id="rs-to">${o.map(x=>`<option value="${x.id}">${x.name}</option>`).join("")}</select><div class="start-actions"><button class="primary" id="rs-give">واگذاری و انصراف</button></div>`:""}
  <div class="start-actions"><button class="danger" id="rs-bank">فروش همه به بانک و انصراف</button><button onclick="closeModal()">بازگشت</button></div>
  <small>فروش به بانک: ساختمان‌ها و ملک‌ها به نصف قیمت (رهنی‌ها بدون مبلغ) فروخته و ابتدا وام‌هایتان پرداخت می‌شود؛ املاک به بانک برمی‌گردد.</small>`);
  const g=document.getElementById("rs-give"); if(g) g.onclick=()=>doResign(p,state.players[+document.getElementById("rs-to").value]);
  document.getElementById("rs-bank").onclick=()=>doResign(p,null);
}
function doResign(p,heir){
  if(!heir) p.properties.forEach(i=>{const t=state.tiles[i];p.cash+=(t.houses||0)*(t.houseCost||0)/2+(t.mortgaged?0:t.price/2);});
  state.loans.filter(l=>l.borrower===p.id).forEach(l=>{const amt=Math.round(l.principal*(1+l.rate)),x=Math.min(Math.max(p.cash,0),amt);p.cash-=x;if(l.lender!==null)state.players[l.lender].cash+=x;});
  state.loans=state.loans.filter(l=>l.borrower!==p.id);
  if(heir){heir.cash+=p.cash;p.properties.forEach(i=>{state.tiles[i].owner=heir.id;heir.properties.push(i);});state.loans.forEach(l=>{if(l.lender===p.id)l.lender=heir.id;});}
  else{p.properties.forEach(i=>{const t=state.tiles[i];t.owner=null;t.houses=0;t.mortgaged=false;});state.loans=state.loans.filter(l=>l.lender!==p.id);}
  p.cash=0;p.properties=[];p.bankrupt=true;p.resigned=true;p.outAt=++state.elimCount;
  closeModal();
  addLog("🏳️ "+p.name+" از بازی انصراف داد"+(heir?" و دارایی‌اش را به "+heir.name+" واگذار کرد.":" و املاکش را به بانک فروخت."));
  checkWin();
  if(!state.over) endTurn(); else render();
}
function propWorth(p){return p.properties.reduce((s,i)=>{const t=state.tiles[i];return s+(t.mortgaged?t.price/2:t.price);},0);}
function bldWorth(p){return p.properties.reduce((s,i)=>{const t=state.tiles[i];return s+(t.houses||0)*(t.houseCost||0);},0);}
function debtNet(p){let d=0;state.loans.forEach(l=>{const v=Math.round(l.principal*(1+l.rate));if(l.borrower===p.id)d-=v;if(l.lender===p.id)d+=v;});return d;}
function netWorth(p){return p.cash+propWorth(p)+bldWorth(p)+debtNet(p);}
function endGame(reason){
  if(state.over) return; state.over=true;
  const alive=activePlayers().slice().sort((x,y)=>netWorth(y)-netWorth(x));
  const out=state.players.filter(p=>p.bankrupt).sort((x,y)=>(y.outAt||0)-(x.outAt||0));
  const rows=alive.map((p,k)=>`<tr><td>${persianNum(k+1)}</td><td>${p.name}</td><td>${p.cash}</td><td>${propWorth(p)}</td><td>${bldWorth(p)}</td><td>${debtNet(p)}</td><td><b>${Math.round(netWorth(p))}</b></td></tr>`)
   .concat(out.map((p,k)=>`<tr style="opacity:.55"><td>${persianNum(alive.length+k+1)}</td><td>${p.name}</td><td colspan="5">${p.resigned?"انصراف":"ورشکسته"}</td></tr>`)).join("");
  showModal("🏆 پایان بازی",`<p>${reason}</p><p>برنده: <b style="color:var(--gold)">${alive[0]?alive[0].name:"—"}</b></p><div style="overflow-x:auto"><table class="rank"><tr><th>رتبه</th><th>بازیکن</th><th>پول</th><th>املاک</th><th>ساختمان</th><th>وام</th><th>مجموع</th></tr>${rows}</table></div><p style="font-size:.78rem;color:var(--muted)">ارزش املاک = قیمت (رهنی: نصف)؛ ساختمان‌ها به قیمت ساخت؛ وام = طلب منهای بدهی.</p><button class="primary" onclick="location.reload()">بازی جدید</button>`);
  render();
}

function gridPos(i){
  if(i<=10) return {col:11-i, row:11};
  if(i<=20) return {col:1, row:11-(i-10)};
  if(i<=30) return {col:1+(i-20), row:1};
  return {col:11, row:1+(i-30)};
}
function buildBoardOnce(){
  const board = document.getElementById("board");
  board.innerHTML="";
  TILES.forEach((t,i)=>{
    const pos = gridPos(i);
    const el = document.createElement("div");
    el.className="tile"+(i%10===0?" corner":"");
    el.style.gridColumn=pos.col; el.style.gridRow=pos.row;
    el.id="tile-"+i; el.onclick=()=>showTileInfo(i);
    let inner="";
    if(t.type==="property") inner += `<div class="grp" style="background:${GROUP_COLORS[t.group]}"></div>`;
    if(t.type==="go") inner += `<div class="icon">🏁</div>`;
    if(t.type==="jail") inner += `<div class="icon">🚔</div>`;
    if(t.type==="free") inner += `<div class="icon">🅿️</div>`;
    if(t.type==="gotojail") inner += `<div class="icon">👮</div>`;
    if(t.type==="chance") inner += `<div class="icon">❓</div>`;
    if(t.type==="chest") inner += `<div class="icon">🎁</div>`;
    if(t.type==="tax") inner += `<div class="icon">💸</div>`;
    if(t.type==="railroad") inner += `<div class="icon">🚉</div>`;
    if(t.type==="utility") inner += `<div class="icon">${t.name.includes("آب")?"🚿":"💡"}</div>`;
    inner += `<div class="nm">${t.name}</div>`;
    if(t.price) inner += `<div class="pr">${t.price}</div>`;
    el.innerHTML = inner;
    board.appendChild(el);
  });
  const center = document.createElement("div");
  center.id="center";
  center.innerHTML = `<div class="logo brandfont">مونوپولی</div><div id="dicestage"><div id="dice"><div class="die" id="die1"></div><div class="die" id="die2"></div></div><div id="dsum"></div></div>`;
  board.appendChild(center);
  const pp=document.createElement("div"); pp.id="popups"; board.appendChild(pp);
  setDie(document.getElementById("die1"),1); setDie(document.getElementById("die2"),1);
}
function pips(v){const m={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[v];let s="";for(let i=0;i<9;i++)s+='<i class="'+(m.includes(i)?"on":"")+'"></i>';return s;}
function setDie(el,v){ if(el) el.innerHTML=pips(v); }
function animateDice(d1,d2,cb){
  const e1=document.getElementById("die1"),e2=document.getElementById("die2"),st=document.getElementById("dicestage");
  if(!e1){ if(cb) cb(); return; }
  st.classList.add("show"); document.getElementById("dsum").textContent="";
  [e1,e2].forEach(e=>{e.classList.remove("land");e.classList.add("rolling");});
  let n=0;
  const iv=setInterval(()=>{
    setDie(e1,1+Math.floor(Math.random()*6)); setDie(e2,1+Math.floor(Math.random()*6));
    if(++n>=11){
      clearInterval(iv); setDie(e1,d1); setDie(e2,d2);
      [e1,e2].forEach(e=>{e.classList.remove("rolling");e.classList.add("land");});
      document.getElementById("dsum").textContent=persianNum(d1+d2)+(d1===d2?" — دوبل! 🎉":"");
      setTimeout(()=>{ if(cb) cb(); },650);
      setTimeout(()=>st.classList.remove("show"),1900);
    }
  },85);
}
function renderTokensAndBuildings(){
  document.querySelectorAll(".house,.hotel").forEach(e=>e.remove());
  state.tiles.forEach((t,i)=>{
    if(t.type==="property"&&t.houses>0){const el=document.getElementById("tile-"+i);if(!el)return;
      if(t.houses===5){const x=document.createElement("div");x.className="hotel";el.appendChild(x);}
      else for(let k=0;k<t.houses;k++){const x=document.createElement("div");x.className="house";x.style.left=(2+k*7)+"px";el.appendChild(x);}}
  });
  const board=document.getElementById("board"); if(!board) return;
  const at={}; state.players.forEach((p,idx)=>{ if(!p.bankrupt){ (at[p.pos]=at[p.pos]||[]).push(idx); } });
  document.querySelectorAll(".tile").forEach(t=>{t.style.boxShadow="";});
  Object.keys(at).forEach(pos=>{
    const el=document.getElementById("tile-"+pos);
    if(el) el.style.boxShadow=at[pos].map((idx,k)=>"inset 0 0 0 "+(2+k*2)+"px "+P_COLOR[idx]).join(",");
  });
  state.players.forEach((p,idx)=>{
    let tok=document.getElementById("tok"+idx);
    if(!tok){ tok=document.createElement("div"); tok.id="tok"+idx; tok.className="token"; board.appendChild(tok); }
    if(p.bankrupt){ tok.style.display="none"; return; }
    tok.style.display="flex"; tok.style.background=P_COLOR[idx]; tok.textContent=P_ICON[idx]; tok.title=p.name;
    tok.classList.toggle("cur",idx===state.current);
    const tile=document.getElementById("tile-"+p.pos); if(!tile) return;
    const size=Math.max(14,Math.round(tile.offsetWidth*0.5)); tok.style.width=tok.style.height=size+"px";
    const g=gridPos(p.pos), bw=board.clientWidth, bh=board.clientHeight;
    const cx=tile.offsetLeft+tile.offsetWidth/2, cy=tile.offsetTop+tile.offsetHeight/2;
    const dx=(g.col===1||g.col===11)?Math.sign(bw/2-cx):0, dy=(g.row===1||g.row===11)?Math.sign(bh/2-cy):0;
    const off=tile.offsetWidth*0.78; let x=cx+dx*off, y=cy+dy*off;
    const grp=at[p.pos], k=grp.indexOf(idx)-(grp.length-1)/2, sp=size*0.95;
    if(dx&&dy){ x+=k*sp*0.7; y+=k*sp*0.7; } else if(dy){ x+=k*sp; } else { y+=k*sp; }
    tok.style.left=(x-size/2)+"px"; tok.style.top=(y-size/2)+"px";
  });
}
window.addEventListener("resize",()=>{ if(state&&document.getElementById("board")&&document.getElementById("board").children.length) renderTokensAndBuildings(); });
function renderPlayers(){
  const pane = document.getElementById("pane-players");
  pane.innerHTML = state.players.map((p,idx)=>{
    return `<div class="player-card ${idx===state.current?"current":""} ${p.bankrupt?"bankrupt":""}">
      <div class="ph"><span><span class="dot" style="background:${P_COLOR[idx]}"></span>${p.name}${p.isBot?" ("+({easy:"آسان",medium:"متوسط",hard:"سخت"}[p.difficulty])+")":""}</span><span class="cash">${p.cash} تومان</span></div>
      <div class="props">${p.inJail?"🔒 در زندان &nbsp;":""}${p.properties.length} ملک ${p.jailCards>0?"| 🎫 "+p.jailCards+" کارت آزادی":""}${state.loans.some(l=>l.borrower===p.id)?" | 💳 بدهی "+Math.round(state.loans.filter(l=>l.borrower===p.id).reduce((s,l)=>s+l.principal*(1+l.rate),0)):""}</div>
    </div>`;
  }).join("");
}
function renderLog(){
  document.getElementById("pane-log").innerHTML = state.log.map(l=>`<div class="log-line">${l}</div>`).join("");
}
function renderMyProps(){
  const me = currentPlayer();
  const pane = document.getElementById("pane-props");
  const label = document.getElementById("props-tab-label");
  if(label) label.textContent = me.isBot ? "املاک "+me.name : (me.name==="شما"?"املاک من":"املاک "+me.name);
  if(me.properties.length===0){ pane.innerHTML=MORT_NOTE+"<p style='color:var(--muted);font-size:.85rem'>"+(me.isBot?me.name+" هنوز ملکی ندارد.":"هنوز ملکی ندارید.")+"</p>"; return; }
  pane.innerHTML = MORT_NOTE + me.properties.map(i=>{
    const t = state.tiles[i];
    let extra="";
    if(me.isBot){ extra=""; }
    else if(t.type==="property"){
      const full = ownsFullGroup(me,t.group);
      extra = `<div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">
        ${full && !t.mortgaged ? `<button onclick="buildHouse(${i})" ${me.cash<t.houseCost||t.houses>=5?"disabled":""}>ساخت (${t.houseCost})</button>`:""}
        ${t.houses>0?`<button onclick="sellHouse(${i})">فروش خانه</button>`:""}
        ${t.houses===0?`<button onclick="toggleMortgage(${i})">${t.mortgaged?"آزاد از رهن":"رهن گذاشتن"}</button>`:""}
      </div>`;
    } else {
      extra = `<div style="margin-top:4px"><button onclick="toggleMortgage(${i})">${t.mortgaged?"آزاد از رهن":"رهن گذاشتن"}</button></div>`;
    }
    return `<div class="pitem" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between"><b>${t.name}</b><span>${t.houses===5?"🏨":"🏠".repeat(t.houses)}${t.mortgaged?" (در رهن)":""}</span></div>
      ${extra}
    </div>`;
  }).join("");
}

function renderActionBar(){
  const bar = document.getElementById("actionbar");
  const info = document.getElementById("turninfo");
  const p = currentPlayer();
  bar.innerHTML="";
  info.innerHTML = "نوبت: <b>"+p.name+"</b>" + (p.inJail?" — در زندان":"")+(state.maxTurns?" — نوبت "+persianNum(p.turnCount)+" از "+persianNum(state.maxTurns):"");

  if(p.bankrupt){ return; }

  if(state.phase==="auction"){
    const a=state.auction;
    const t=state.tiles[a.tileIdx];
    const actingId = a.bidders[a.turnIdx % a.bidders.length];
    const actingPlayer = state.players[actingId];
    info.innerHTML = `مزایده «${t.name}» — بالاترین پیشنهاد: <b>${a.highBid}</b> (${a.highBidder!==null?state.players[a.highBidder].name:"—"})`;
    if(actingPlayer && !actingPlayer.isBot){
      info.innerHTML += " — نوبت پیشنهاد: <b>"+actingPlayer.name+"</b>";
      addBtn("💰 پیشنهاد "+(a.highBid+10), ()=>humanBid(actingId), actingPlayer.cash < a.highBid+10);
      addBtn("+50", ()=>humanBid(actingId,50), actingPlayer.cash < a.highBid+50);addBtn("+100", ()=>humanBid(actingId,100), actingPlayer.cash < a.highBid+100);
      addBtn("انصراف از مزایده", ()=>humanFold(actingId));
    }
    return;
  }

  if(!p.isBot){
    if(p.inJail && state.phase==="roll"){
      addBtn("🎲 پرتاب تاس", doRoll);
      addBtn("💵 پرداخت ۵۰ (آزادی)", payJailFine, p.cash<50);
      if(p.jailCards>0) addBtn("🎫 استفاده از کارت آزادی", useJailCard);
    } else if(state.phase==="roll"){
      addBtn("🎲 پرتاب تاس", doRoll);
      addBtn("🤝 معامله", openTradeModal);addBtn("💳 وام", openLoanModal);
    } else if(state.phase==="buy-decision"){
      const t = state.tiles[state.pendingBuy];
      info.innerHTML = `«${t.name}» را به قیمت ${t.price} بخرید؟`;
      addBtn("✅ خرید", buyProperty, p.cash<t.price);
      addBtn("❌ رد کردن (مزایده)", declineBuy);
    } else if(state.phase==="end"){
      addBtn("پایان نوبت ⏭️", ()=>{ if(state.phase==="end") endTurn(); });
      addBtn("🤝 معامله", openTradeModal);addBtn("💳 وام", openLoanModal);
    }
  } else {
    info.innerHTML += " — در حال تصمیم‌گیری...";
  }
}
function addBtn(label, fn, disabled){
  const b=document.createElement("button");
  b.className="primary";
  b.textContent=label;
  b.disabled=!!disabled;
  b.onclick=fn;
  document.getElementById("actionbar").appendChild(b);
}

function render(){
  renderTokensAndBuildings();
  renderPlayers();
  renderLog();
  renderMyProps();
  renderActionBar();
  if(!state.over && !document.querySelector(".modal") && (state.phase==="roll"||state.phase==="end")){
    const cp=currentPlayer();
    if(cp && cp.bankrupt && !state._endSched){
      state._endSched=true; const cid=cp.id;
      later(()=>{ state._endSched=false; if(!state.over && currentPlayer() && currentPlayer().id===cid && currentPlayer().bankrupt) endTurn(); },700);
    }
  }
}

const GUIDE_HTML = `<div class="guide">
<h4>روند کلی بازی</h4><p>هر بازیکن با ۱۵۰۰ تومان شروع می‌کند. به‌نوبت تاس می‌ریزید، حرکت می‌کنید و روی خانه‌ای که فرود آمده‌اید عمل می‌کنید (خرید ملک، پرداخت اجاره یا مالیات، کشیدن کارت). با تاس دوبل دوباره تاس می‌ریزید. قبل یا بعد از حرکت می‌توانید ساختمان بسازید، ملک رهن بگذارید، معامله کنید یا وام بگیرید و در پایان «پایان نوبت» را بزنید. روی هر خانه‌ی ملک کلیک کنید تا قیمت و جدول اجاره‌اش را ببینید. بازی وقتی تمام می‌شود که همه جز یک نفر ورشکسته یا منصرف شوند، یا تعداد نوبت انتخابی (اگر تعیین شده باشد) تمام شود؛ سپس بر اساس ارزش کل رتبه‌بندی می‌شوید.</p>
<h4>هدف بازی</h4><p>خرید و توسعه املاک برای دریافت اجاره از سایر بازیکنان، تا زمانی که همه به جز یک نفر ورشکسته شوند.</p>
<h4>حرکت</h4><p>هر نوبت، بازیکن دو تاس می‌ریزد و به همان تعداد خانه حرکت می‌کند. عبور از خانه شروع، ۲۰۰ تومان جایزه دارد.</p>
<h4>خرید ملک</h4><p>در صورت فرود روی ملک بدون مالک، می‌توانید آن را به قیمت درج‌شده بخرید یا از خرید صرف‌نظر کنید که در این صورت ملک به مزایده گذاشته می‌شود و بالاترین پیشنهاد برنده می‌شود.</p>
<h4>اجاره</h4><p>در صورت فرود روی ملک متعلق به دیگری، باید اجاره پرداخت کنید. اجاره با تعداد خانه/هتل، یا با مالکیت کامل یک دسته رنگی (بدون خانه) دو برابر می‌شود. اجاره ایستگاه‌های راه‌آهن به تعداد ایستگاه‌های هم‌مالک افزایش می‌یابد. اجاره شرکت‌های آب و برق بر اساس مجموع تاس محاسبه می‌شود.</p>
<h4>خانه و هتل</h4><p>در صورت مالکیت کامل یک دسته رنگی، می‌توانید به‌صورت یکنواخت روی هر ملک خانه بسازید (حداکثر ۴ خانه) و سپس به هتل ارتقا دهید. فروش خانه نصف قیمت را بازمی‌گرداند.</p>
<h4>کارت‌های شانس و صندوق اجتماعی</h4><p>با فرود روی این خانه‌ها یک کارت تصادفی کشیده می‌شود که می‌تواند پول بدهد یا بگیرد، جابجایی ایجاد کند یا به زندان بفرستد.</p>
<h4>مالیات</h4><p>فرود روی خانه‌های مالیات، مبلغ ثابتی را از بازیکن کسر می‌کند.</p>
<h4>زندان</h4><p>با فرود روی «برو به زندان» یا کارت مربوطه، بازیکن به زندان می‌رود. برای آزادی: پرداخت ۵۰ تومان، استفاده از کارت آزادی، یا آوردن تاس دوبل (حداکثر تا ۳ نوبت، پس از آن باید ۵۰ تومان پرداخت شود).</p>
<h4>دوبل</h4><p>آوردن تاس دوبل یک نوبت اضافه می‌دهد؛ سه دوبل پیاپی، مستقیم به زندان می‌فرستد.</p>
<h4>معامله و مذاکره</h4><p>با دکمه «معامله» طرف مقابل را انتخاب کنید و مشخص کنید هر کس چه ملک‌هایی می‌دهد (مثلاً ملک من در برابر ملک تو) و چه مقدار پول اضافه می‌پردازد (مثلاً ملک من + ۵۰ تومان از من). طرف مقابل می‌تواند <b>قبول</b>، <b>رد</b> یا <b>تغییر پیشنهاد</b> بدهد؛ پیشنهاد جدید به طرف اول برمی‌گردد و او هم می‌تواند قبول، رد یا دوباره تغییر بدهد. این رفت‌وبرگشت تا وقتی یک نفر قبول یا رد کند ادامه دارد. ملک‌های دارای ساختمان در دسته‌ی خود قابل معامله نیستند (اول ساختمان‌ها را بفروشید). اگر ملک رهنی دریافت کنید، ۱۰٪ مبلغ رهن را به بانک می‌پردازید. بات‌ها هم به هم و به شما پیشنهاد می‌دهند (معمولاً برای تکمیل یک دسته‌ی رنگی) و بر اساس ارزش، سطح سختی و تکمیل‌شدن دسته‌ها قبول، رد یا پیشنهاد جدید می‌دهند.</p>
<h4>رهن</h4><p>در صورت نیاز به نقدینگی، می‌توانید ملک بدون خانه را در رهن بگذارید (نصف قیمت را دریافت می‌کنید) و بعداً با پرداخت ۱۱۰٪ آن را آزاد کنید. ملک دررهن اجاره نمی‌گیرد.</p>
<h4>ورشکستگی</h4><p>اگر بازیکنی نتواند بدهی خود را حتی پس از فروش خانه‌ها و رهن گذاشتن املاک بپردازد، ورشکسته شده و از بازی خارج می‌شود؛ املاک او به طلبکار (یا در صورت بدهی به بانک، به بانک) منتقل می‌شود.</p>
<h4>مزایده (قانون کامل)</h4><p>اگر ملکی را نخرید، به مزایده می‌رود و همه‌ی بازیکنان فعال (حتی خودِ شما) شرکت می‌کنند. مزایده از پیشنهاد صفر شروع می‌شود؛ به‌نوبت هر بازیکن می‌تواند بالاتر برود (+۱۰، +۵۰، +۱۰۰) یا انصراف بدهد (انصراف قطعی است). وقتی نوبت دوباره به بالاترین پیشنهاددهنده برسد، مزایده تمام می‌شود و او مبلغ را به بانک می‌پردازد و ملک را می‌گیرد. اگر همه انصراف بدهند، ملک بدون مالک می‌ماند.</p>
<h4>ساخت خانه و هتل و اجاره</h4><p>با داشتن همه‌ی ملک‌های یک رنگ (و رهنی نبودن هیچ‌کدام) می‌توانید از تب «املاک من» خانه بسازید؛ ساخت باید یکنواخت باشد (اختلاف ساختمان دو ملک هم‌رنگ حداکثر ۱). پس از ۴ خانه، ساخت پنجمی هتل است. اجاره‌ی هر ملک به‌ترتیب افزایش می‌یابد: اجاره‌ی پایه ← دو برابر (مالکیت کامل دسته بدون ساختمان) ← ۱ خانه ← ۲ خانه ← ۳ خانه ← ۴ خانه ← هتل (بیشترین). ساختمان را می‌توان به نصف قیمت ساخت فروخت (اول از ملکی که بیشترین ساختمان را دارد). ایستگاه‌ها: ۲۵، ۵۰، ۱۰۰ و ۲۰۰ به تعداد ایستگاه‌های مالک؛ شرکت آب/برق: ۴ برابر تاس (یک شرکت) یا ۱۰ برابر (هر دو).</p>
<h4>رهن و آزادسازی</h4><p>ملکی که ساختمان ندارد (و هیچ ملک هم‌رنگش ساختمان ندارد) را می‌توان رهن گذاشت و نصف قیمتش را نقد گرفت؛ ملک رهنی اجاره نمی‌گیرد. برای آزادسازی باید نصف قیمت به‌علاوه‌ی ۱۰٪ سود بپردازید. در ارزش‌گذاری پایان بازی ملک رهنی نصف حساب می‌شود.</p>
<h4>وام</h4><p>با دکمه «وام» می‌توانید از بانک (سود ثابت ۱۰٪، سقف کل ۱۰۰۰ تومان برای هر بازیکن) یا از بازیکن دیگر (سود دلخواه ۱۵٪ تا ۵۰٪؛ وام‌دهنده می‌تواند بپذیرد یا رد کند) وام بگیرید. سود بانک همیشه کمتر از سود بازیکنان است. وام پس از یک دور کامل، یعنی ابتدای نوبت بعدی خود شما، همراه با سود خودکار کسر می‌شود (اگر پول نباشد ابتدا ساختمان‌ها فروخته و املاک رهن می‌شوند و در نهایت ورشکستگی به نفع وام‌دهنده رخ می‌دهد). پرداخت زودهنگام هم ممکن است. بات‌ها در بحران می‌توانند از بانک وام بگیرند.</p>
<h4>انصراف از بازی</h4><p>دکمه «انصراف» (در نوبت خودتان) دو گزینه دارد: واگذاری همه‌ی املاک و پول به یک بازیکن دیگر، یا فروش همه‌چیز به بانک (ساختمان‌ها و ملک‌ها به نصف قیمت؛ املاک رهنی چیزی نمی‌دهند) که ابتدا صرف پرداخت وام‌هایتان می‌شود و املاک به بانک برمی‌گردد.</p>
<h4>پایان بازی و رتبه‌بندی</h4><p>بازی پایان می‌یابد وقتی فقط یک بازیکن بماند یا (اگر در شروع انتخاب کرده باشید) همه‌ی بازیکنان به تعداد نوبت تعیین‌شده برسند. رتبه‌بندی بر اساس «ارزش کل» = پول + قیمت املاک (رهنی: نصف) + ارزش ساختمان‌ها (به قیمت ساخت) + طلب منهای بدهی وام‌هاست. بازیکنان ورشکسته یا منصرف در انتهای جدول می‌آیند (هر کس دیرتر خارج شده بالاتر).</p>
</div>`;

/* ===================== START SCREEN LOGIC ===================== */
let selectedHumans = 2;
let selectedBots = 0;
let selectedEnd = 0;
document.querySelectorAll("#end-mode .pill").forEach(el=>{el.onclick=()=>{document.querySelectorAll("#end-mode .pill").forEach(x=>x.classList.remove("active"));el.classList.add("active");selectedEnd=parseInt(el.dataset.v);};});

function persianNum(n){ return String(n).replace(/\d/g, d=>"۰۱۲۳۴۵۶۷۸۹"[d]); }

document.querySelectorAll("#human-count .pill").forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll("#human-count .pill").forEach(x=>x.classList.remove("active"));
    el.classList.add("active");
    selectedHumans = parseInt(el.dataset.v);
    const maxBots = 4-selectedHumans;
    const minBots = selectedHumans===1 ? 1 : 0;
    if(selectedBots>maxBots) selectedBots=maxBots;
    if(selectedBots<minBots) selectedBots=minBots;
    renderBotCountBar();
    renderDiffRows();
  };
});

function renderBotCountBar(){
  const wrap = document.getElementById("bot-count");
  const maxBots = 4-selectedHumans;
  const minBots = selectedHumans===1 ? 1 : 0;
  document.getElementById("min-bot-note").classList.toggle("hidden", minBots===0);
  let html="";
  for(let v=minBots; v<=maxBots; v++){
    html += `<div class="pill ${v===selectedBots?"active":""}" data-v="${v}">${persianNum(v)}</div>`;
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll(".pill").forEach(p=>{
    p.onclick=()=>{
      wrap.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
      p.classList.add("active");
      selectedBots = parseInt(p.dataset.v);
      renderDiffRows();
    };
  });
}

function renderDiffRows(){
  const wrap = document.getElementById("bot-diffs");
  const n = selectedBots;
  if(n<=0){ document.getElementById("bot-diff-wrap").classList.add("hidden"); wrap.innerHTML=""; return; }
  document.getElementById("bot-diff-wrap").classList.remove("hidden");
  let html="";
  for(let i=0;i<n;i++){
    html += `<div class="diff-row"><span>بات ${i+1}</span>
      <div class="pillbar" data-bot="${i}">
        <div class="pill active" data-d="easy">آسان</div>
        <div class="pill" data-d="medium">متوسط</div>
        <div class="pill" data-d="hard">سخت</div>
      </div></div>`;
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll(".pillbar").forEach(bar=>{
    bar.querySelectorAll(".pill").forEach(p=>{
      p.onclick=()=>{ bar.querySelectorAll(".pill").forEach(x=>x.classList.remove("active")); p.classList.add("active"); };
    });
  });
}
renderBotCountBar();
renderDiffRows();

document.getElementById("btn-start").onclick=()=>{
  const botDiffs=[];
  document.querySelectorAll("#bot-diffs .pillbar").forEach(bar=>{
    botDiffs.push(bar.querySelector(".pill.active").dataset.d);
  });
  if(selectedHumans+botDiffs.length<2){
    showModal("خطا","<p>برای شروع بازی حداقل ۲ بازیکن (واقعی یا بات) لازم است.</p><button class='primary' onclick='closeModal()'>باشه</button>");
    return;
  }
  document.getElementById("screen-start").classList.add("hidden");
  document.getElementById("screen-game").classList.remove("hidden");
  buildBoardOnce();
  newGame(selectedHumans, botDiffs);
};
document.getElementById("btn-guide-start").onclick=()=>{ showModal("راهنمای کامل بازی", GUIDE_HTML+"<button class='primary' onclick='closeModal()' style='margin-top:10px'>بستن</button>"); };
document.getElementById("btn-guide").onclick=()=>{ showModal("راهنمای کامل بازی", GUIDE_HTML+"<button class='primary' onclick='closeModal()' style='margin-top:10px'>بستن</button>"); };
document.getElementById("btn-restart").onclick=()=>{ showModal("بازی جدید","<p>بازی فعلی از بین می‌رود. مطمئن هستید؟</p><div class='start-actions'><button class='danger' onclick='location.reload()'>بله، بازی جدید</button><button onclick='closeModal()'>ادامه بازی</button></div>"); };
document.getElementById("btn-resign").onclick=openResign;

document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    document.querySelectorAll(".tabpane").forEach(p=>p.classList.add("hidden"));
    document.getElementById("pane-"+tab.dataset.t).classList.remove("hidden");
  };
});
</script>
